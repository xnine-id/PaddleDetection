services:
  paddle_detection:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MQTT_HOST: mqtt
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,gpu,video,graphics,display
    ports:
      - "${PORT}:${PORT}"
    networks:
      - default
      - deepface-engine_default
    volumes:
      - ./configs/docker_config.yml:/app/configs/config.yml:ro
      - ./configs/infer_cfg_pphuman.yml:/app/configs/infer_cfg_pphuman.yml:ro
      - ./configs/infer_cfg_ppvehicle.yml:/app/configs/infer_cfg_ppvehicle.yml:ro
      - ./configs/infer_cfg_combine.yml:/app/configs/infer_cfg_combine.yml:ro
      - ./storage:/app/storage:rw
      - ./storage/private/models:/root/.cache/paddle:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu, compute, utility, video, graphics, display ]

networks:
  deepface-engine_default:
    external: true
